name: test cases

on:
  schedule:
    - cron: '0 11 11 * *'
  push:
    branches: [ master, dev ]

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        extra: [ base, excel, plot, all, dev ]
        python-version: [ '3.11', '3.12', '3.13' ]
        include:
          - os: windows-latest
            extra: all
            python-version: '3.12'
    env:
      EXTRAS: ${{ matrix.extra }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - if: matrix.extra == 'plot' || matrix.extra == 'all'
        name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - if: matrix.extra == 'base'
        name: Install Dependencies
        run: uv sync --extra test
      - if: matrix.extra != 'base'
        name: Install Dependencies
        run: uv sync --extra test --extra ${{ matrix.extra }}
      - name: Run Test
        run: uv run coverage run --source=formulas -m unittest discover -s test -p 'test_*.py'
      - if: matrix.python-version == '3.12' && matrix.extra == 'all' && matrix.os == 'ubuntu-latest'
        name: Run Coveralls
        run: uv run coveralls --service=github
